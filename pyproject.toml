[project]
name = "webapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jreboll", email = "jonatanrebollar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.1.0",
]

[project.scripts]
webapp = "webapp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
