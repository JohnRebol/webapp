version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: monthly
