name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  pytest:
    name: test
    runs-on: ubuntu-24.04

    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #  v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #  v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest tests

  build:
    name: build
    runs-on: ubuntu-24.04

    outputs:
      image: ghcr.io/${{ steps.image-name.outputs.name }}:${{ github.sha }}
    needs: pytest
    permissions:
      contents: read
      packages: write

    steps:
      - *checkout

      - name: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: image-name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          context: .
          tags: ghcr.io/${{ steps.image-name.outputs.name }}:${{ github.sha }},ghcr.io/${{ steps.image-name.outputs.name }}:v0.1.${{ github.run_number }}

  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      APP_HOST: app-host # or app-host.<tailnet>.ts.net / 100.x.y.z if MagicDNS doesn't resolve
      DEPLOY_USER: jreboll # the user whose authorized_keys has the deploy pubkey
      REMOTE_DIR: /home/jreboll/webapp

    steps:
      - *checkout
      - name: Join tailnet as tag:gha-runner
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd #v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-runner

      - name: Port 22 reachable
        run: nc -zv -w 5 "$APP_HOST" 22

      - name: Deploy via SSH
        env:
          KEY: ${{ secrets.TAILSCALE_DEPLOY_SSH_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no $DEPLOY_USER@$APP_HOST"

          $SSH "mkdir -p $REMOTE_DIR && cat > $REMOTE_DIR/docker-compose.yml" < docker-compose.yml
          $SSH "cd $REMOTE_DIR && IMAGE=$IMAGE docker compose up -d --pull always"

      - name: Run smoke-test
        run: |
          curl --fail -sS \
            --retry 10 --retry-delay 2 --retry-connrefused  \
            --connect-timeout 5 --max-time 10  \
            "http://$APP_HOST:5000/health"
