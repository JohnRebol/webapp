all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    ansible_ssh_private_key_file: ~/.ssh/forge
  children:
    k8s_control_plane:
      hosts:
        k8s-cp-1:
          ansible_host: 10.10.1.150
    k8s_workers:
      hosts:
        k8s-worker-1:
          ansible_host: 10.10.1.151
        k8s-worker-2:
          ansible_host: 10.10.1.152
    k8s_cluster:
      children:
        k8s_control_plane:
        k8s_workers:
