- name: Deploy users
  hosts: all
  become: true
  tasks:
    - name: Add the user 'deploy'
      ansible.builtin.user:
        name: deploy
        comment: Ansible deploy user
        shell: /bin/bash

    - name: Allow deploy user to use sudo without a password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Add deploy user's SSH key
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ lookup('file', '~/.ssh/forge.pub') }}"
        state: present

    - name: Disable root login and password authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        owner: root
        group: root
        mode: "0644"
        validate: "sshd -t -f %s"
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

- name: Initialize Kubernetes control plane
  hosts: k8s_control_plane
  become: true
  tasks:
    - name: Render and validate kubeadm config
      ansible.builtin.template:
        src: templates/kubeadm-config.yml.j2
        dest: /etc/kubernetes/kubeadm-config.yml
        validate: kubeadm config validate --config %s

    - name: Initialize the control plane
      ansible.builtin.command:
        cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yml
        creates: /etc/kubernetes/admin.conf

    - name: Check whether Calico CRDs exist
      ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} get crd ippools.projectcalico.org
      register: calico_crd
      changed_when: false
      failed_when: false

    - name: Install Calico CRDs (v1 manifest, Kubernetes 1.36+)
      ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} create -f {{ calico_manifests }}/v3_projectcalico_org.yaml
      when: calico_crd.rc != 0

    - name: Check whether the Tigera operator namespace exists
      ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} get namespace tigera-operator
      register: tigera_ns
      changed_when: false
      failed_when: false

    - name: Install Tigera operator
      ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} create -f {{ calico_manifests }}/tigera-operator.yaml
      when: tigera_ns.rc != 0

    - name: Copy Calico custom resources to the control plane
      ansible.builtin.copy:
        src: files/calico-custom-resources.yaml
        dest: /etc/kubernetes/calico-custom-resources.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Check whether the Calico Installation exists
      ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} get installation default
      register: calico_install
      changed_when: false
      failed_when: false

    - name: Create Calico custom resources
      ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} create -f /etc/kubernetes/calico-custom-resources.yaml
      when: calico_install.rc != 0

    - name: Generate a worker join command
      ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
      register: join_cmd
      changed_when: false
      no_log: true

    - name: Save the join command as a fact
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_cmd.stdout | trim }}"
      no_log: true

- name: Join worker nodes
  hosts: k8s_workers
  become: true
  tasks:
    - name: Join the cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['k8s_control_plane'][0]].kubeadm_join_command }}"
        creates: /etc/kubernetes/kubelet.conf
      no_log: true
